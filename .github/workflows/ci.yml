name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Cheap checks that need no toolchain: they fail in seconds when a contract file goes missing.
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate policies.json
        run: jq empty policies.json

      # Two checks in one pass: the cases parse, and the case counts published in
      # docs/ai/evaluation.md still match what is on disk. The second exists because they drifted —
      # a case was added and the table was not — and a repo whose selling point is that it measures
      # its assistant cannot be sloppy about how many measurements it claims to have.
      - name: Validate the eval cases and the counts the docs publish
        run: |
          python3 - <<'EOF'
          import glob, re, sys, yaml
          from collections import Counter

          cases = glob.glob("evals/cases/*.yaml")
          if not cases:
              sys.exit("no eval cases found")

          tally = Counter()
          for path in cases:
              with open(path) as f:
                  doc = yaml.safe_load(f)
              for key in ("id", "category", "user", "prompt", "expect"):
                  if key not in doc:
                      sys.exit(f"{path}: missing key '{key}'")
              tally[doc["category"]] += 1

          print(f"{len(cases)} cases OK")

          doc_path = "docs/ai/evaluation.md"
          with open(doc_path) as f:
              text = f.read()

          section = re.search(
              r"^## Categories and volume \(v1 = (\d+) cases\)$(.*?)(?=^## |\Z)", text, re.M | re.S
          )
          if not section:
              sys.exit(f"{doc_path}: no '## Categories and volume (v1 = N cases)' section to check against")

          documented_total = int(section.group(1))
          documented = {
              m.group(1): int(m.group(2))
              for m in re.finditer(r"^\| (\S+) \| (\d+) \|", section.group(2), re.M)
          }

          problems = []
          if documented_total != len(cases):
              problems.append(f"the heading says {documented_total} cases; evals/cases/ holds {len(cases)}")
          for category in sorted(set(documented) | set(tally)):
              if documented.get(category) != tally.get(category):
                  problems.append(
                      f"{category}: the table says {documented.get(category, 'nothing')}, "
                      f"evals/cases/ holds {tally.get(category, 0)}"
                  )

          if problems:
              sys.exit(f"{doc_path} disagrees with evals/cases/:\n  " + "\n  ".join(problems))

          print(f"{doc_path} agrees: " + ", ".join(f"{c}={n}" for c, n in sorted(tally.items())))
          EOF

      - name: Agent context files present
        run: |
          for f in AGENTS.md prompts/system.md policies.json .agent/commands.md; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done

      # A deploy file only breaks when someone deploys, which is the worst moment to find out.
      - name: Validate the Compose files
        run: |
          docker compose config --quiet
          JWT_SIGNING_KEY=ci POSTGRES_PASSWORD=ci \
            docker compose -f docker-compose.coolify.yml config --quiet

  backend:
    runs-on: ubuntu-latest

    # The tests run against a real PostgreSQL: provider translation, ILIKE and date handling are
    # exactly the parts an in-memory provider would let through untested.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes

      - run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release
        env:
          TEST_POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Web/package-lock.json

      - run: npm ci

      - run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - run: npm run build

  # Evals against a real model: cheap pinned model, temperature 0, 1 retry per case, per-run
  # token budget. One red case = red build.
  #
  # This is the only job that spends money, so it is the only one with an authorization gate:
  # the model is called solely for runs the repository owner triggers from a branch of this
  # repository. Anyone else's pull request — anyone's, on a public repo — runs every other job
  # but never reaches the provider. It also spends nothing on changes no eval case could detect:
  # a README, a screenshot, an ADR. The job itself always runs to completion so that its check is
  # always reported and can stay a required check for merging; when the gate closes, the run is
  # green with a loud warning instead of pending forever.
  #
  # That last part is why the path filter lives inside the gate rather than in `on:` or a job-level
  # `if:`. Either of those would leave the check unreported, and a required check that never
  # arrives blocks the merge it was meant to protect.
  #
  # Configure in the repository settings:
  #   variables: EVALS_MODEL (e.g. an inexpensive pinned model id)
  #   secrets:   AZURE_OPENAI_ENDPOINT + AZURE_OPENAI_API_KEY, or OPENAI_API_KEY (+ OPENAI_BASE_URL)
  evals:
    needs: [repo-checks, backend]
    runs-on: ubuntu-latest

    env:
      EVALS_MODEL: ${{ vars.EVALS_MODEL }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EVALS_REPORT_PATH: ${{ github.workspace }}/evals-report.md

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Runs before the checkout: an unauthorized run must not even fetch the tree it was asked
      # to evaluate, and this way the decision is never taken by code the pull request supplies.
      - name: Authorize the run
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          skip() {
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Evals skipped: $1"
            {
              echo "> [!WARNING]"
              echo "> **Evals skipped** — $1"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # A pull request from a fork carries no secrets and could not run the suite anyway;
          # saying so explicitly beats a confusing "no credentials configured".
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_HEAD_REPO" != "$REPO" ]; then
            skip "the pull request comes from a fork. A maintainer runs the suite from a branch of this repository before merging."
          fi

          # Write access to this repository is the trust boundary for everything else in CI; eval
          # spend is narrower than that, and stays with the owner.
          if [ "$ACTOR" != "$OWNER" ] && [ "$PR_AUTHOR" != "$OWNER" ]; then
            skip "only @$OWNER can spend eval tokens (this run was triggered by @$ACTOR)."
          fi

          if [ -z "$EVALS_MODEL" ] || { { [ -z "$AZURE_OPENAI_ENDPOINT" ] || [ -z "$AZURE_OPENAI_API_KEY" ]; } && [ -z "$OPENAI_API_KEY" ]; }; then
            skip "EVALS_MODEL and provider credentials are not configured."
          fi

          # What the assistant's measured behaviour is actually made of: the app itself, the
          # system prompt, the policy the gate reads, the cases and harness, and this file. A
          # change confined to anything else — docs, screenshots, the Compose files — cannot move
          # an eval case, so it does not deserve a model call. Listed as paths rather than
          # inferred, because a case going quietly unrun is the failure mode worth avoiding.
          RELEVANT='^(src/|prompts/|evals/|policies\.json$|\.github/workflows/ci\.yml$)'

          # Asked of the API, not of a checkout: the gate still decides before the tree it was
          # asked to evaluate is ever fetched.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            FILES=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename') || FILES=""
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            FILES=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename') || FILES=""
          else
            FILES=""
          fi

          # An empty answer means the question could not be asked — a new branch, a force push, a
          # transient API failure — and the compare endpoint stops listing at 300 files. Both cases
          # run the suite: a prompt regression reaching main costs more than a run of cheap tokens.
          COUNT=$(printf '%s' "$FILES" | grep -c . || true)

          if [ "$COUNT" -gt 0 ] && [ "$COUNT" -lt 300 ] && ! printf '%s\n' "$FILES" | grep -qE "$RELEVANT"; then
            skip "no change under src/, prompts/, evals/, policies.json or this workflow — nothing an eval case could detect."
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-dotnet@v6
        if: steps.gate.outputs.run == 'true'
        with:
          dotnet-version: '10.0.x'

      - name: Run evals
        if: steps.gate.outputs.run == 'true'
        run: dotnet test evals/InvoiceAssistant.Evals --configuration Release
        env:
          TEST_POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres

      - name: Publish report to the job summary
        if: always() && hashFiles('evals-report.md') != ''
        run: cat "$EVALS_REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always() && hashFiles('evals-report.md') != ''
        uses: actions/upload-artifact@v7
        with:
          name: evals-report
          path: evals-report.md
