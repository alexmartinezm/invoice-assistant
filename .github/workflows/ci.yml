name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Cheap checks that need no toolchain: they fail in seconds when a contract file goes missing.
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate policies.json
        run: jq empty policies.json

      - name: Validate eval cases are parseable YAML
        run: |
          python3 - <<'EOF'
          import glob, sys, yaml
          cases = glob.glob("evals/cases/*.yaml")
          if not cases:
              sys.exit("no eval cases found")
          for path in cases:
              with open(path) as f:
                  doc = yaml.safe_load(f)
              for key in ("id", "category", "user", "prompt", "expect"):
                  if key not in doc:
                      sys.exit(f"{path}: missing key '{key}'")
          print(f"{len(cases)} cases OK")
          EOF

      - name: Agent context files present
        run: |
          for f in AGENTS.md prompts/system.md policies.json .agent/commands.md; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done

  backend:
    runs-on: ubuntu-latest

    # The tests run against a real PostgreSQL: provider translation, ILIKE and date handling are
    # exactly the parts an in-memory provider would let through untested.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes

      - run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release
        env:
          TEST_POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Web/package-lock.json

      - run: npm ci

      - run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - run: npm run build

  # Evals against a real model: cheap pinned model, temperature 0, 1 retry per case, per-run
  # token budget. One red case = red build. Forks receive no secrets, so without credentials the
  # job warns and skips instead of failing (the harness itself also skips per case).
  #
  # Configure in the repository settings:
  #   variables: EVALS_MODEL (e.g. an inexpensive pinned model id)
  #   secrets:   AZURE_OPENAI_ENDPOINT + AZURE_OPENAI_API_KEY, or OPENAI_API_KEY (+ OPENAI_BASE_URL)
  evals:
    needs: [repo-checks, backend]
    runs-on: ubuntu-latest

    env:
      EVALS_MODEL: ${{ vars.EVALS_MODEL }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EVALS_REPORT_PATH: ${{ github.workspace }}/evals-report.md

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Detect eval credentials
        id: credentials
        run: |
          if [ -n "$EVALS_MODEL" ] && { { [ -n "$AZURE_OPENAI_ENDPOINT" ] && [ -n "$AZURE_OPENAI_API_KEY" ]; } || [ -n "$OPENAI_API_KEY" ]; }; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Evals skipped: EVALS_MODEL and provider credentials are not configured (forks never receive secrets)."
            echo "> [!WARNING]" >> "$GITHUB_STEP_SUMMARY"
            echo "> Evals skipped: no eval model credentials configured." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.credentials.outputs.available == 'true'
        with:
          dotnet-version: '10.0.x'

      - name: Run evals
        if: steps.credentials.outputs.available == 'true'
        run: dotnet test evals/InvoiceAssistant.Evals --configuration Release
        env:
          TEST_POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres

      - name: Publish report to the job summary
        if: always() && hashFiles('evals-report.md') != ''
        run: cat "$EVALS_REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always() && hashFiles('evals-report.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: evals-report
          path: evals-report.md
